<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASVIS — Masuk & Daftar</title>
<link rel="stylesheet" href = "style/login.css">

</head>
<body>

<div class="ticket">
  <div class="sprockets" aria-hidden="true"></div>
  <div class="content">

    <h1 class="wordmark">ASVIS</h1>
    <p class="tagline">Empowering Humanity, One Breath at a Time.</p>

    <input type="radio" name="tab" id="tab-masuk" class="tab-input" checked>
    <input type="radio" name="tab" id="tab-daftar" class="tab-input">

    <div class="tabs">
      <label for="tab-masuk">Masuk</label>
      <label for="tab-daftar">Daftar</label>
    </div>

    <div class="panels">

      <section class="panel panel-masuk">
        <form action="#" method="post">
          <div class="field">
            <label for="masuk-user">Username atau email</label>
            <input id="masuk-user" name="identifier" type="text" autocomplete="username" placeholder="nama_pengguna" required>
          </div>
          <div class="field">
            <label for="masuk-pass">Kata sandi</label>
            <input id="masuk-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <div class="row-between">
            <span class="remember">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember" style="margin:0;color:inherit;">Ingat saya</label>
            </span>
            <a href="#">Lupa kata sandi?</a>
          </div>
          <button type="submit" class="submit">Masuk</button>
        </form>
        <p class="switch-line">Belum punya akun? <label for="tab-daftar">Daftar di sini</label></p>
      </section>

      <section class="panel panel-daftar">
        <form action="#" method="post">
          <div class="field">
            <label for="daftar-user">Username</label>
            <input id="daftar-user" name="username" type="text" autocomplete="username" placeholder="nama_pengguna" required>
          </div>
          <div class="field">
            <label for="daftar-email">Email</label>
            <input id="daftar-email" name="email" type="email" autocomplete="email" placeholder="kamu@contoh.com" required>
          </div>
          <div class="field">
            <label for="daftar-pass">Kata sandi</label>
            <input id="daftar-pass" name="password" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter" minlength="8" required>
          </div>
          <p class="hint">Gunakan kombinasi huruf, angka, dan simbol.</p>
          <button type="submit" class="submit">Buat akun</button>
        </form>
        <p class="switch-line">Sudah punya akun? <label for="tab-masuk">Masuk di sini</label></p>
      </section>

    </div>
  </div>
</div>

</body>
<script src = "script/script.js"></script>

</html>
